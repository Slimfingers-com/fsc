name: Backend Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fsc_test
          POSTGRES_USER: fsc
          POSTGRES_PASSWORD: fsc
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fsc -d fsc_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_NAME: fsc_test
      DATABASE_USER: fsc
      DATABASE_PASSWORD: fsc
      SECRET_KEY: ci-test-secret
      GEMINI_API_KEY: ""
      OPENAI_API_KEY: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Verify dependency lock
        run: python scripts/verify_requirements_lock.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q
