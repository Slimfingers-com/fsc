name: Promote Release Candidate

on:
  workflow_run:
    workflows:
      - "Full Stack E2E"
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: release-candidate-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify commit is still current main
        run: |
          current_main="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha'
          )"
          if [ "$current_main" != "$RELEASE_SHA" ]; then
            echo "A newer main commit exists; skipping stale promotion."
            exit 78
          fi

      - name: Wait for all release gates on exact commit
        run: |
          required=(
            "Backend Tests"
            "Frontend Tests"
            "Release Metadata"
          )

          for attempt in $(seq 1 60); do
            runs="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100"
            )"
            pending=0

            for workflow in "${required[@]}"; do
              conclusion="$(
                printf '%s' "$runs" |
                  jq -r                     --arg name "$workflow"                     --arg sha "$RELEASE_SHA"                     '[
                      .workflow_runs[]
                      | select(
                          .name == $name
                          and .head_sha == $sha
                        )
                    ]
                    | sort_by(.created_at)
                    | last
                    | .conclusion // ""'
              )"

              case "$conclusion" in
                success)
                  echo "$workflow: success"
                  ;;
                failure|cancelled|timed_out|action_required|stale)
                  echo "$workflow: $conclusion" >&2
                  exit 1
                  ;;
                *)
                  echo "$workflow: waiting"
                  pending=1
                  ;;
              esac
            done

            if [ "$pending" -eq 0 ]; then
              exit 0
            fi

            sleep 10
          done

          echo "Timed out waiting for release gates." >&2
          exit 1

      - name: Validate release metadata and tag
        id: release
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          tag="v$version"
          python scripts/verify_release_version.py --tag "$tag"
          notes="docs/operations/release-$version.md"
          test -s "$notes"

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "notes=$notes"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub prerelease
        run: |
          tag="${{ steps.release.outputs.tag }}"
          version="${{ steps.release.outputs.version }}"
          notes="${{ steps.release.outputs.notes }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            existing_target="$(
              gh api                 "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag"                 --jq '.object.sha'
            )"
            if [ "$existing_target" != "$RELEASE_SHA" ]; then
              echo "Existing tag $tag points at $existing_target, expected $RELEASE_SHA." >&2
              exit 1
            fi
            echo "Release $tag already exists on the expected commit."
            exit 0
          fi

          gh release create "$tag"             --target "$RELEASE_SHA"             --title "FSC $version"             --notes-file "$notes"             --prerelease
