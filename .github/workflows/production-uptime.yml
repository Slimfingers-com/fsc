name: Production uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/production-uptime.yml"
      - "scripts/check_public_uptime.py"
      - "scripts/tests/test_public_uptime.py"

permissions:
  contents: read

concurrency:
  group: production-uptime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout monitor and tests
        uses: actions/checkout@v5
      - name: Test failure and recovery handling
        run: python3 -m unittest discover -s scripts/tests -p test_public_uptime.py -v
      - name: Check full public-page rendering with bounded retries
        run: python3 scripts/check_public_uptime.py
