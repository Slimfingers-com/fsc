name: Generate Dependency Locks

on:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/package.json"
      - "backend/requirements.txt"
      - ".github/workflows/generate-dependency-locks.yml"

permissions:
  contents: write

jobs:
  generate-locks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Resolve frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Resolve backend lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip freeze --local | LC_ALL=C sort > backend/requirements.lock

      - name: Commit generated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json backend/requirements.lock
          if git diff --cached --quiet; then
            echo "Dependency locks are already current."
            exit 0
          fi
          git commit -m "Lock frontend and backend dependencies"
          git push origin HEAD:${{ github.head_ref }}
