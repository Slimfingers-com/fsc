server {
    listen 80;
    server_name _;

    server_tokens off;

    # Docker Compose recreates the frontend container with a different IP.
    # Nginx's default static upstream resolution keeps the old IP indefinitely
    # and then returns HTTP 502 even though the new frontend is healthy.
    # Resolve via the embedded Docker DNS server when the cached entry expires.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    location / {
        set $frontend_upstream frontend:3000;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
