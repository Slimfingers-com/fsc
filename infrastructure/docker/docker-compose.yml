name: fsc

services:

  nginx:
    image: nginx:stable
    container_name: fsc-nginx
    restart: unless-stopped
    networks:
      - fsc-network
    volumes:
      - nginx_data:/etc/nginx/conf.d

  frontend:
    container_name: fsc-frontend
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      FSC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - fsc-network

  backend:
    container_name: fsc-backend
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    ports:
      - "8000:8000"
    volumes:
      - ../../backend:/app
    networks:
      - fsc-network

  worker:
    container_name: fsc-worker
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.main"]
    restart: unless-stopped
    env_file:
      - ../../.env
    volumes:
      - ../../backend:/app
    depends_on:
      - postgres
    networks:
      - fsc-network

  content-worker:
    container_name: fsc-content-worker
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.content_main"]
    restart: unless-stopped
    env_file:
      - ../../.env
    volumes:
      - ../../backend:/app
    depends_on:
      - postgres
    networks:
      - fsc-network

  search-worker:
    container_name: fsc-search-worker
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.search_main"]
    restart: unless-stopped
    env_file:
      - ../../.env
    volumes:
      - ../../backend:/app
    depends_on:
      - postgres
    networks:
      - fsc-network

  entity-topic-worker:
    container_name: fsc-entity-topic-worker
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.entity_topic_main"]
    restart: unless-stopped
    env_file:
      - ../../.env
    volumes:
      - ../../backend:/app
    depends_on:
      - postgres
    networks:
      - fsc-network

  story-worker:
    container_name: fsc-story-worker
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.story_main"]
    restart: unless-stopped
    env_file:
      - ../../.env
    volumes:
      - ../../backend:/app
    depends_on:
      - postgres
    networks:
      - fsc-network

  claim-worker:
    container_name: fsc-claim-worker
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.claim_main"]
    restart: unless-stopped
    env_file:
      - ../../.env
    volumes:
      - ../../backend:/app
    depends_on:
      - postgres
    networks:
      - fsc-network

  perspective-worker:
    container_name: fsc-perspective-worker
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.perspective_main"]
    restart: unless-stopped
    env_file:
      - ../../.env
    volumes:
      - ../../backend:/app
    depends_on:
      - postgres
    networks:
      - fsc-network

  claim-relation-worker:
    container_name: fsc-claim-relation-worker
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.claim_relation_main"]
    restart: unless-stopped
    env_file:
      - ../../.env
    volumes:
      - ../../backend:/app
    depends_on:
      - postgres
    networks:
      - fsc-network

  evidence-worker:
    container_name: fsc-evidence-worker
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.evidence_main"]
    restart: unless-stopped
    env_file:
      - ../../.env
    volumes:
      - ../../backend:/app
    depends_on:
      - postgres
    networks:
      - fsc-network

  consensus-worker:
    container_name: fsc-consensus-worker
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.consensus_main"]
    restart: unless-stopped
    env_file:
      - ../../.env
    volumes:
      - ../../backend:/app
    depends_on:
      - postgres
    networks:
      - fsc-network

  coverage-worker:
    container_name: fsc-coverage-worker
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.coverage_main"]
    restart: unless-stopped
    env_file:
      - ../../.env
    volumes:
      - ../../backend:/app
    depends_on:
      - postgres
    networks:
      - fsc-network

  postgres:
    image: postgres:17
    container_name: fsc-postgres
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fsc-network

  redis:
    image: redis:8-alpine
    container_name: fsc-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - fsc-network

networks:
  fsc-network:

volumes:
  postgres_data:
  redis_data:
  nginx_data:
