x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

name: fsc

services:
  nginx:
    image: nginx:stable
    container_name: fsc-nginx
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${FSC_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - fsc-network

  frontend:
    container_name: fsc-frontend
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      FSC_API_URL: http://backend:8000
      FSC_API_TIMEOUT_MS: 8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fsc-network

  backend:
    container_name: fsc-backend
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ../../.env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fsc-network

  worker:
    container_name: fsc-worker
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.main"]
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fsc-network

  content-worker:
    container_name: fsc-content-worker
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.content_main"]
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fsc-network

  search-worker:
    container_name: fsc-search-worker
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.search_main"]
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fsc-network

  entity-topic-worker:
    container_name: fsc-entity-topic-worker
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.entity_topic_main"]
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fsc-network

  story-worker:
    container_name: fsc-story-worker
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.story_main"]
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fsc-network

  claim-worker:
    container_name: fsc-claim-worker
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.claim_main"]
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fsc-network

  perspective-worker:
    container_name: fsc-perspective-worker
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.perspective_main"]
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fsc-network

  claim-relation-worker:
    container_name: fsc-claim-relation-worker
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.claim_relation_main"]
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fsc-network

  evidence-worker:
    container_name: fsc-evidence-worker
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.evidence_main"]
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fsc-network

  consensus-worker:
    container_name: fsc-consensus-worker
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.consensus_main"]
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fsc-network

  coverage-worker:
    container_name: fsc-coverage-worker
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.coverage_main"]
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fsc-network

  postgres:
    image: postgres:17
    container_name: fsc-postgres
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME is required}
      POSTGRES_USER: ${DATABASE_USER:?DATABASE_USER is required}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USER:?DATABASE_USER is required} -d ${DATABASE_NAME:?DATABASE_NAME is required}",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fsc-network

  redis:
    image: redis:8-alpine
    container_name: fsc-redis
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - redis_data:/data
    networks:
      - fsc-network

networks:
  fsc-network:

volumes:
  postgres_data:
  redis_data:
